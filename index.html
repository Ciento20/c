<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actualizar lista M3U</title>
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#16211d;--mute:#6a7771;--line:#d9e0dc;--acc:#0f7a5c;--acc-ink:#fff;--warn:#b3321f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#10171b;--panel:#182126;--ink:#e6efeb;--mute:#8a9b94;--line:#2a373d;--acc:#3ecf9f;--acc-ink:#07261c;--warn:#ff8a75}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}label.c{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:8px 0}
input,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}input[type=checkbox]{width:auto}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
#go{width:100%;background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700;font-size:17px;padding:15px}
#go:disabled{opacity:.6}details summary{cursor:pointer;font-weight:600}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#log{font:12px/1.5 ui-monospace,Consolas,monospace;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:var(--mute)}
#log b{color:var(--ink)}#log .e{color:var(--warn);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}a{color:var(--acc);word-break:break-all}
</style></head><body><main>
<h1>Actualizar lista M3U</h1>
<div class="card">
  <button id="go">▶ Actualizar todo</button>
  <div class="bar"><i id="pb"></i></div>
  <div id="st" style="font-weight:600">Listo para empezar.</div>
  <div class="row"><button id="stop" style="display:none">Detener</button></div>
  <div id="res" style="margin-top:10px"></div>
</div>
<div class="card"><div id="log"></div></div>
<div class="card"><details open><summary>Ajustes</summary>
  <label>Fuente de la lista</label><select id="mode"><option value="ipns">ERA (IPNS / IPFS)</option><option value="url">Enlace directo</option></select>
  <label>Identificador IPNS</label><input id="ipk" value="k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb">
  <label>Subruta del archivo</label><input id="ipp" value="/data/listas/listaplana.txt">
  <label>Pasarela propia (opcional)</label><input id="ipg" placeholder="http://127.0.0.1:8080">
  <p style="margin:6px 0"><a id="ipo" href="#" target="_blank" rel="noopener">Abrir la fuente en una pestaña</a></p>
  <label>Pegar contenido de la lista (si la descarga falla)</label><textarea id="paste" rows="3" style="width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px ui-monospace,monospace"></textarea>
  <label>Motor Ace Stream</label><input id="engine" value="http://127.0.0.1:6878">
  <label>Enlace de la lista (solo si la fuente es «Enlace directo»)</label><input id="src" placeholder="https://…/lista.m3u">
  <label>…o archivo (si el enlace da error CORS)</label><input id="lfile" type="file">
  <label>Token de GitHub (permiso «gist»)</label><input id="token" type="password" autocomplete="off">
  <label>ID del Gist (vacío = crea uno nuevo)</label><input id="gist">
  <label>Nombre del archivo en el Gist</label><input id="file" value="canales.m3u">
  <label>URL de la guía EPG (opcional)</label><input id="epg" value="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/EPG_dobleM.xml">
  <label class="c"><input type="checkbox" id="hashn"> Poner el hash (10 primeros caracteres) en vez del nombre</label>
  <label class="c"><input type="checkbox" id="tvg" checked> tvg-id y tvg-name = nombre del grupo</label>
  <label class="c"><input type="checkbox" id="pub"> Gist público (solo si lo crea nuevo)</label>
  <div class="g3"><div><label>A la vez</label><input id="workers" type="number" min="1" max="10" value="4"></div>
  <div><label>Espera (s)</label><input id="timeout" type="number" min="5" max="90" value="25"></div>
  <div><label>Reintentos</label><input id="retries" type="number" min="0" max="3" value="1"></div></div>
  <div class="g3"><div style="grid-column:span 2"><label>Canales caídos</label><select id="dead"><option value="remove">Quitarlos</option><option value="move">Grupo «Caídos»</option><option value="keep">Al final de su grupo</option></select></div>
  <div><label>Mínimo OK</label><input id="minok" type="number" min="1" value="1"></div></div>
  <div class="row"><button id="chkE">Comprobar motor</button><button id="chkG">Comprobar GitHub</button></div>
  <p style="font-size:12px;color:var(--mute)">Los ajustes (incluido el token) se guardan solo en este navegador. Si no funcionan las conexiones, abre este archivo desde tu PWA o servidor local.</p>
</details></div>
<script>
/*CORE*/
const ACE=/^(https?:\/\/[^/]+)\/ace\/getstream\?(?:[^#]*&)?id=([0-9a-fA-F]{20,})/i;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseM3U(text,base){let head='#EXTM3U',entries=[],cur=null;const conv=u=>base?u.replace(/^acestream:\/\/([0-9a-f]{40}).*/i,(m,h)=>`${base}/ace/getstream?id=${h.toLowerCase()}`):u;
  for(const raw of text.replace(/^\uFEFF/,'').split(/\r?\n/)){const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTM3U')){head=l;continue}
    if(l.startsWith('#EXTINF')){cur={lines:[l],url:null};continue}
    if(l.startsWith('#')){if(cur)cur.lines.push(l);continue}
    if(cur){const u=conv(l);cur.lines.push(u);cur.url=u;entries.push(cur);cur=null}else entries.push({lines:['#EXTINF:-1,'+l,conv(l)],url:conv(l)})}
  return{head,entries}}
const groupOf=e=>{const m=e.lines[0].match(/group-title="([^"]*)"/);return m?m[1]:''};
function setAttr(l,k,v){v=v.replace(/"/g,"'");const re=new RegExp('\\b'+k+'="[^"]*"');
  return re.test(l)?l.replace(re,()=>`${k}="${v}"`):l.replace(/^(#EXTINF:\S+)/,(m,a)=>`${a} ${k}="${v}"`)}
function setName(l,n){const i=l.lastIndexOf('"'),c=l.indexOf(',',Math.max(i,0));return (c>-1?l.slice(0,c):l)+','+n}
async function fj(u,ms,sig){const a=new AbortController(),f=()=>a.abort(),t=setTimeout(f,ms);sig&&sig.addEventListener('abort',f);
  try{const r=await fetch(u,{signal:a.signal});return await r.json()}finally{clearTimeout(t);sig&&sig.removeEventListener('abort',f)}}
async function testAce(m,tmo,sig){const base=m[1],id=m[2],pid='p'+Math.random().toString(36).slice(2,10);let r;
  try{r=await fj(`${base}/ace/getstream?id=${id}&format=json&pid=${pid}`,15000,sig)}catch(e){return{ok:false,why:'motor: '+e.message}}
  if(!r.response)return{ok:false,why:String(r.error||'rechazado').slice(0,60)};
  const {stat_url,command_url}=r.response,t0=Date.now();
  try{while(Date.now()-t0<tmo*1000&&!sig.aborted){await sleep(1500);let s;
      try{s=(await fj(stat_url,8000,sig)).response||{}}catch(e){continue}
      if(s.status==='dl'||(s.peers>0&&s.speed_down>0)){await sleep(3000);
        try{s=(await fj(stat_url,8000,sig)).response||s}catch(e){}
        return{ok:true,speed:s.speed_down||0,peers:s.peers||0}}}
    return{ok:false,why:'sin datos a tiempo'}}
  finally{fetch(command_url+'?method=stop').catch(()=>{})}}
async function testHttp(u,tmo,sig){const a=new AbortController(),f=()=>a.abort(),t=setTimeout(f,Math.min(tmo,15)*1000);sig.addEventListener('abort',f);
  try{await fetch(u,{mode:'no-cors',signal:a.signal});return{ok:true,speed:0}}catch(e){return{ok:false,why:e.message}}finally{clearTimeout(t);a.abort();sig.removeEventListener('abort',f)}}
async function testOne(u,tmo,sig){try{const m=u.match(ACE);return m?await testAce(m,tmo,sig):await testHttp(u,tmo,sig)}catch(e){return{ok:false,why:e.message}}}
const HASH40=/(?<![a-f0-9])[a-f0-9]{40}(?![a-f0-9])/i;
const isValidEra=t=>t&&(t.includes('#EXTINF')||HASH40.test(t));
function sanitizeName(n){return String(n||'')
  .replace(/\bshickat(?:\.[a-z]+)*\b/gi,' ')
  .replace(/acestream:\/\/\S*/gi,' ')
  .replace(/\b(?:id|hash|content_id|infohash)\s*[=:]\s*\S*/gi,' ')
  .replace(/[a-f0-9]{8,}/gi,m=>(m.length>=20||(/\d/.test(m)&&/[a-f]/i.test(m)))?' ':m)
  .replace(/[\(\[\{]\s*[\)\]\}]/g,' ')
  .replace(/(?:\s*\|\s*){2,}/g,' | ')
  .replace(/^[\s\-–|,:;=>]+|[\s\-–|,:;=>]+$/g,'')
  .replace(/\s{2,}/g,' ').replace(/"/g,"'").trim()}
const eraName=n=>sanitizeName(String(n).split('-->')[0].replace(/\b(HDP|SDP|FHDP)\b/gi,'').trim());
function parseEra(text,base){
  if(text.includes('#EXTINF')){
    const r=parseM3U(text,base);
    for(const e of r.entries){let l=e.lines[0];const i=l.lastIndexOf('"'),c=l.indexOf(',',Math.max(i,0));
      const nm=c>-1?eraName(l.slice(c+1)):'';
      if(nm){l=setName(l,nm);if(!groupOf(e))l=setAttr(l,'group-title',nm)}e.lines[0]=l}
    return r}
  let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
  if(/<\/?(?:html|body|pre|div|p|br|span)\b/i.test(text)){
    const doc=new DOMParser().parseFromString(text.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(?:p|div|li|tr)>/gi,'\n'),'text/html');
    doc.querySelectorAll('script,style').forEach(n=>n.remove());lines=(doc.body.textContent||'').split(/\r?\n/)}
  const entries=[],seen=new Set();let last='';
  for(const raw of lines){const l=raw.trim();if(!l)continue;
    const m=l.includes('-->')?null:l.match(HASH40);
    if(!m){last=eraName(l);continue}
    const id=m[0].toLowerCase();if(!last||seen.has(id))continue;seen.add(id);
    const u=`${base}/ace/getstream?id=${id}`;
    entries.push({lines:[`#EXTINF:-1 group-title="${last}",${last}`,u],url:u})}
  return{head:'#EXTM3U',entries}}
async function fetchIpns(key,sub,sig,log,custom){
  if(!key)throw new Error('Falta el identificador IPNS.');if(!sub.startsWith('/'))sub='/'+sub;
  const hosts=['https://ipfs.io','https://dweb.link','https://w3s.link','https://gateway.pinata.cloud','https://4everland.io','https://nftstorage.link','https://gateway.lighthouse.storage','https://trustless-gateway.link','https://ipfs.filebase.io'];
  const gws=[...(custom?[custom.replace(/\/$/,'')+`/ipns/${key}${sub}`]:[]),...hosts.map(h=>`${h}/ipns/${key}${sub}`),`https://${key}.ipns.dweb.link${sub}`];
  for(let ronda=1;ronda<=3;ronda++){
    if(sig&&sig.aborted)throw new Error('Detenido.');
    if(ronda>1){log(`Reintentando (${ronda}/3)… las pasarelas a veces tardan en resolver el IPNS la primera vez.`);await sleep(4000)}
    const master=new AbortController();sig&&sig.addEventListener('abort',()=>master.abort());
    const one=async u=>{const a=new AbortController(),f=()=>a.abort(),t=setTimeout(f,40000),h=new URL(u).host.replace(key+'.','');master.signal.addEventListener('abort',f);
      try{const r=await fetch(u,{signal:a.signal});if(!r.ok)throw new Error('HTTP '+r.status);const tx=await r.text();if(!isValidEra(tx))throw new Error('contenido no válido');log('✓ pasarela '+esc(h)+' ('+tx.length+' bytes)');return tx}
      catch(e){if(!master.signal.aborted)log('✕ '+esc(h)+': '+esc(e.message==='Failed to fetch'?'sin respuesta (bloqueada, caída o sin CORS)':e.message));throw e}finally{clearTimeout(t)}};
    try{return await Promise.any(gws.map(one))}catch(e){}finally{master.abort()}
  }
  throw new Error('Ninguna pasarela devolvió el archivo. Abre el enlace de la fuente en una pestaña, copia el contenido y pégalo en el recuadro «Pegar contenido».');}
async function upload(cfg,content){if(!cfg.token)throw new Error('Falta el token de GitHub');
  const files={[cfg.file]:{content}},id=cfg.gistId;
  const r=await fetch(id?`${cfg.api}/gists/${id}`:`${cfg.api}/gists`,{method:id?'PATCH':'POST',
    headers:{Authorization:'token '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(id?{files}:{description:'Lista M3U',public:cfg.pub,files})});
  if(!r.ok)throw new Error(`GitHub respondió ${r.status}: `+(await r.text()).slice(0,140));
  const j=await r.json();return{id:j.id,link:`https://gist.githubusercontent.com/${j.owner.login}/${j.id}/raw/${cfg.file}`}}
async function runAll(cfg,text,io){const {log,prog,step,sig}=io;
  const {head,entries}=parseEra(text,cfg.engine);if(!entries.length)throw new Error('La lista no tiene canales. No se toca el Gist.');
  log(`${entries.length} canales.`);step('2/4 Limpiando nombres…');
  for(const e of entries){let l=e.lines[0];const g=groupOf(e),m=e.url.match(ACE);
    if(cfg.hashn&&m)l=setName(l,m[2].slice(0,10));if(cfg.tvg&&g)l=setAttr(setAttr(l,'tvg-id',g),'tvg-name',g);e.lines[0]=l}
  const urls=[...new Set(entries.map(e=>e.url))],fm=urls.map(u=>u.match(ACE)).find(Boolean);
  if(fm){try{await fj(fm[1]+'/webui/api/service?method=get_version',5000,sig)}catch(e){
    throw new Error(`El motor Ace Stream no responde en ${fm[1]} (${e.name}: ${e.message}). Comprueba que está abierto; si lo está, el navegador bloquea la conexión. No se sube nada.`)}}
  step('3/4 Probando enlaces…');const res=new Map();
  for(let ronda=0;ronda<=cfg.retries;ronda++){const todo=ronda?urls.filter(u=>!res.get(u).ok):urls;if(!todo.length)break;
    log(ronda?`<b>Reintento ${ronda}: ${todo.length} enlaces</b>`:`<b>Probando ${todo.length} enlaces (${cfg.workers} a la vez)</b>`);let i=0,done=0;
    const w=async()=>{while(i<todo.length&&!sig.aborted){const u=todo[i++],r=await testOne(u,cfg.timeout,sig);if(sig.aborted)return;
      res.set(u,r);done++;log(`${r.ok?'✓':'✕'} …${esc(u.slice(-12))} ${r.ok?Math.round(r.speed)+' KB/s':esc(r.why)}`);
      prog(done,todo.length,[...res.values()].filter(x=>x.ok).length)}};
    await Promise.all(Array.from({length:cfg.workers},w));if(sig.aborted)throw new Error('Detenido. No se sube nada.')}
  const ok=e=>res.get(e.url)&&res.get(e.url).ok,nOk=entries.filter(ok).length;
  log(`<b>Funcionan ${nOk} de ${entries.length}.</b>`);
  if(nOk<cfg.minok)throw new Error('Funcionan muy pocos: parece un fallo de conexión. No se sube nada.');
  let good=[],dead=[];
  for(const g of new Set(entries.map(groupOf))){const es=entries.filter(e=>groupOf(e)===g);
    good.push(...es.filter(ok).sort((a,b)=>(res.get(b.url).speed||0)-(res.get(a.url).speed||0)));
    const bad=es.filter(e=>!ok(e));
    if(cfg.dead==='keep')good.push(...bad);
    else{if(cfg.dead==='move')for(const e of bad){const l=e.lines[0];e.lines[0]=/group-title="/.test(l)?l.replace(/group-title="[^"]*"/,'group-title="Caídos"'):setAttr(l,'group-title','Caídos')}dead.push(...bad)}}
  if(cfg.dead==='move')good.push(...dead);
  const out=(cfg.epg?`#EXTM3U url-tvg="${cfg.epg}"`:head)+'\n'+good.map(e=>e.lines.join('\n')+'\n').join('');
  step('4/4 Subiendo al Gist…');const up=await upload(cfg,out);
  return{out,nOk,total:entries.length,...up}}
/*ENDCORE*/
const $=s=>document.querySelector(s);
const F=['ipg','mode','ipk','ipp','engine','src','token','gist','file','epg','workers','timeout','retries','dead','minok'],CB=['hashn','tvg','pub'];
try{const s=JSON.parse(localStorage.getItem('m3uauto')||'{}');F.forEach(k=>{if(s[k]!=null)$('#'+k).value=s[k]});CB.forEach(k=>{if(s[k]!=null)$('#'+k).checked=s[k]})}catch(e){}
const save=()=>{try{const s={};F.forEach(k=>s[k]=$('#'+k).value);CB.forEach(k=>s[k]=$('#'+k).checked);localStorage.setItem('m3uauto',JSON.stringify(s))}catch(e){}};
const upo=()=>{const k=$('#ipk').value.trim(),p=$('#ipp').value.trim();$('#ipo').href=`https://ipfs.io/ipns/${k}${p.startsWith('/')?p:'/'+p}`};
document.addEventListener('input',()=>{save();upo()});upo();
const getCfg=()=>({mode:$('#mode').value,ipnsKey:$('#ipk').value.trim(),ipnsPath:$('#ipp').value.trim(),ipnsGw:$('#ipg').value.trim(),engine:($('#engine').value.trim()||'http://127.0.0.1:6878').replace(/\/$/,''),src:$('#src').value.trim(),token:$('#token').value.trim(),gistId:$('#gist').value.trim(),file:$('#file').value.trim()||'canales.m3u',epg:$('#epg').value.trim(),
  hashn:$('#hashn').checked,tvg:$('#tvg').checked,pub:$('#pub').checked,workers:Math.max(1,Math.min(10,+$('#workers').value||4)),timeout:Math.max(5,+$('#timeout').value||25),
  retries:Math.max(0,+$('#retries').value||0),dead:$('#dead').value,minok:Math.max(1,+$('#minok').value||1),api:'https://api.github.com'});
const log=(h,c)=>{const d=document.createElement('div');if(c)d.className=c;d.innerHTML=h;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight};
const step=t=>{$('#st').textContent=t;log('<b>'+t+'</b>')};
const prog=(d,t,ok)=>{$('#pb').style.width=(100*d/t)+'%';$('#st').textContent=`Probando ${d}/${t} · ✓ ${ok} funcionan`};
let ctl=null;
function busy(b){$('#go').disabled=b;$('#stop').style.display=b?'inline-block':'none'}
$('#stop').onclick=()=>ctl&&ctl.abort();
$('#go').onclick=async()=>{if(ctl)return;save();const cfg=getCfg();ctl=new AbortController();busy(true);$('#log').innerHTML='';$('#res').innerHTML='';$('#pb').style.width='0';let wl;
  try{try{wl=await navigator.wakeLock.request('screen')}catch(e){}
    step('1/4 Descargando lista…');let text;const f=$('#lfile').files[0];
    if(f)text=await f.text();else if($('#paste').value.trim())text=$('#paste').value;else if(cfg.mode==='ipns'){log('Buscando el archivo en pasarelas IPFS (IPNS)…');text=await fetchIpns(cfg.ipnsKey,cfg.ipnsPath,ctl.signal,log,cfg.ipnsGw)}else{if(!cfg.src)throw new Error('Pon el enlace de la lista o elige un archivo.');
      try{const r=await fetch(cfg.src);if(!r.ok)throw new Error('HTTP '+r.status);text=await r.text()}
      catch(e){throw new Error(`No se pudo descargar (${e.message}). Si es un bloqueo CORS, descarga la lista y elígela en «archivo».`)}}
    log('Primeras líneas: '+esc(text.split(/\r?\n/).slice(0,3).join(' ⏎ ').slice(0,200)));
    const r=await runAll(cfg,text,{log,prog,step,sig:ctl.signal});
    $('#gist').value=r.id;save();$('#pb').style.width='100%';$('#st').textContent=`✅ Listo: ${r.nOk} de ${r.total} funcionan y están en el Gist.`;
    $('#res').innerHTML=`Enlace fijo (siempre la última versión):<br><a href="${r.link}" target="_blank" rel="noopener">${r.link}</a><div class="row"><button id="cp">Copiar enlace</button><button id="dl">Descargar .m3u</button></div>`;
    $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(r.link);$('#cp').textContent='Copiado'}catch(e){}};
    $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.out],{type:'audio/x-mpegurl'}));a.download=cfg.file;a.click()};
  }catch(e){$('#st').textContent='❌ '+e.message;log('❌ '+esc(e.message),'e')}
  finally{try{wl&&wl.release()}catch(e){}ctl=null;busy(false)}};
$('#chkE').onclick=async()=>{const u=($('#engine').value.trim()||'http://127.0.0.1:6878').replace(/\/$/,'');
  try{const j=await fj(u+'/webui/api/service?method=get_version',5000);log('✅ Motor responde en '+u+': '+JSON.stringify(j.result||j).slice(0,80))}
  catch(e){log(`❌ Sin conexión con ${u} (${e.name}: ${e.message}). ¿Ace Stream abierto? Si lo está, el navegador lo bloquea.`,'e')}};
$('#chkG').onclick=async()=>{const t=$('#token').value.trim();if(!t)return log('Pon el token primero','e');
  try{const r=await fetch('https://api.github.com/user',{headers:{Authorization:'token '+t}});const j=await r.json();log(r.ok?'✅ Token válido: '+j.login:'❌ GitHub respondió '+r.status+' (token incorrecto o sin permiso)',r.ok?'':'e')}
  catch(e){log('❌ '+e.message,'e')}};
</script></main></body></html>
